server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the api service, mirroring vite's dev-server proxy
    # (vite.config.ts) — Better Auth's session cookie depends on the browser
    # seeing the web app and the API on the same origin.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routing — unmatched paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
